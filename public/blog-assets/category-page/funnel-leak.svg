<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="800" height="360" fill="#F5F2EC"/>
  <rect x="8" y="8" width="784" height="344" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="44" font-size="16" font-weight="bold" fill="#E85D3A" letter-spacing="2">CATEGORY → PDP — THE LEAK WAS POST-CLICK</text>

  <!-- Funnel -->
  <rect x="280" y="70" width="240" height="48" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="4"/>
  <text x="400" y="102" font-size="18" font-weight="black" fill="#0A0A0A" text-anchor="middle">Category visits</text>

  <text x="400" y="142" font-size="18" font-weight="black" fill="#0A0A0A" text-anchor="middle">▼</text>

  <rect x="280" y="150" width="240" height="48" rx="10" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="400" y="182" font-size="18" font-weight="bold" fill="#0A0A0A" text-anchor="middle">Grid click (ok)</text>

  <text x="400" y="222" font-size="18" font-weight="black" fill="#E85D3A" text-anchor="middle">▼</text>

  <rect x="280" y="230" width="240" height="48" rx="10" fill="#E85D3A" stroke="#0A0A0A" stroke-width="4"/>
  <text x="400" y="262" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PDP — bare specs</text>

  <!-- Insight box -->
  <rect x="40" y="300" width="720" height="44" rx="10" fill="#F59E0B" stroke="#0A0A0A" stroke-width="4"/>
  <text x="400" y="330" font-size="16" font-weight="bold" fill="#0A0A0A" text-anchor="middle">Clicks were fine. Post-click engagement was dead.</text>
</svg>