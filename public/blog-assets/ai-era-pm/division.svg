<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="800" height="320" fill="#F5F2EC"/>
  <rect x="8" y="8" width="784" height="304" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="44" font-size="16" font-weight="bold" fill="#E85D3A" letter-spacing="2">AI-ERA PM — DIVISION OF LABOR</text>

  <!-- Human column -->
  <rect x="40" y="80" width="350" height="220" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="60" y="110" font-size="16" font-weight="bold" fill="#0A0A0A" letter-spacing="1">HUMAN</text>
  <text x="60" y="144" font-size="16" font-weight="bold" fill="#0A0A0A">Strategy &amp; Judgment</text>
  <text x="60" y="178" font-size="14" fill="#0A0A0A">• Define success criteria</text>
  <text x="60" y="206" font-size="14" fill="#0A0A0A">• Choose problems worth solving</text>
  <text x="60" y="234" font-size="14" fill="#0A0A0A">• Approve / reject AI output</text>
  <text x="60" y="262" font-size="14" fill="#0A0A0A">• Own outcomes</text>

  <!-- AI column -->
  <rect x="410" y="80" width="350" height="220" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="430" y="110" font-size="16" font-weight="bold" fill="#0A0A0A" letter-spacing="1">AI</text>
  <text x="430" y="144" font-size="16" font-weight="bold" fill="#0A0A0A">Execution &amp; Volume</text>
  <text x="430" y="178" font-size="14" fill="#0A0A0A">• Draft specs from transcripts</text>
  <text x="430" y="206" font-size="14" fill="#0A0A0A">• Generate test cases</text>
  <text x="430" y="234" font-size="14" fill="#0A0A0A">• Summarize feedback</text>
  <text x="430" y="262" font-size="14" fill="#0A0A0A">• Never ships without review</text>

  <!-- Divider label -->
  <line x1="400" y1="100" x2="400" y2="280" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="8,8"/>
  <text x="400" y="70" font-size="12" font-weight="bold" fill="#0A0A0A" text-anchor="middle" opacity="0.6">BOUNDARY</text>
</svg>