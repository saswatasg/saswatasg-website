<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="400" fill="#F5F2EC"/>
  <rect x="8" y="8" width="944" height="384" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="52" font-size="13" font-weight="bold" fill="#E85D3A" letter-spacing="2">DISCOVERY → ROADMAP — 20 CALLS, 12 VERTICALS, 1 BRIEF</text>

  <!-- Step 1: Interviews -->
  <rect x="40" y="86" width="280" height="120" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="60" y="114" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STEP 1</text>
  <text x="60" y="138" font-size="14" font-weight="bold" fill="#0A0A0A">20+ Structured Calls</text>
  <text x="60" y="162" font-size="12" fill="#0A0A0A">12 verticals</text>
  <text x="60" y="180" font-size="12" fill="#0A0A0A">Signal-rich notes</text>
  <text x="60" y="198" font-size="12" fill="#0A0A0A">Pain, budget, owner, phrasing</text>

  <line x1="320" y1="146" x2="340" y2="146" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="340,140 350,146 340,152" fill="#0A0A0A"/>

  <!-- Step 2: Signal Extraction -->
  <rect x="360" y="86" width="280" height="120" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="380" y="114" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STEP 2</text>
  <text x="380" y="138" font-size="14" font-weight="bold" fill="#0A0A0A">Signal Extraction</text>
  <text x="380" y="162" font-size="12" fill="#0A0A0A">Each note → claim, not story</text>
  <text x="380" y="180" font-size="12" fill="#0A0A0A">Pain, budget, owner, phrasing</text>
  <text x="380" y="198" font-size="12" fill="#0A0A0A">Structured per-interview card</text>

  <line x1="640" y1="146" x2="660" y2="146" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="660,140 670,146 660,152" fill="#0A0A0A"/>

  <!-- Step 3: Triple Scoring -->
  <rect x="680" y="86" width="240" height="120" rx="12" fill="#E85D3A" stroke="#0A0A0A" stroke-width="4"/>
  <text x="695" y="114" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="1">STEP 3</text>
  <text x="695" y="138" font-size="14" font-weight="bold" fill="#FFFFFF">Triple Score</text>
  <text x="695" y="162" font-size="12" fill="#FFFFFF" opacity="0.9">Severity (1–5)</text>
  <text x="695" y="180" font-size="12" fill="#FFFFFF" opacity="0.9">ROI (budget × freq × time)</text>
  <text x="695" y="198" font-size="12" fill="#FFFFFF" opacity="0.9">Buildability (tech × data × GTM)</text>

  <line x1="920" y1="146" x2="940" y2="146" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="940,140 950,146 940,152" fill="#0A0A0A"/>

  <!-- Step 4: Top-3 Brief -->
  <rect x="40" y="240" width="880" height="140" rx="12" fill="#F59E0B" stroke="#0A0A0A" stroke-width="4"/>
  <text x="60" y="268" font-size="15" font-weight="bold" fill="#0A0A0A">STEP 4 — TOP-3 OPPORTUNITY BRIEF</text>
  <text x="60" y="296" font-size="13" fill="#0A0A0A">Use case 1: Agentic dispatch for manufacturing — severity 5, ROI 4, buildability 4</text>
  <text x="60" y="320" font-size="13" fill="#0A0A0A">Use case 2: AI routing for logistics — severity 4, ROI 5, buildability 3</text>
  <text x="60" y="344" font-size="13" fill="#0A0A0A">Use case 3: Agentic onboarding for SaaS — severity 4, ROI 4, buildability 5</text>
  <text x="60" y="372" font-size="12" fill="#0A0A0A" opacity="0.7">One slide per use case: pain, outcome, budget, buildability · One ranking: 0–6 month sequence</text>
</svg>