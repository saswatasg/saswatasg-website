<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="800" height="420" fill="#F5F2EC"/>
  <rect x="8" y="8" width="784" height="404" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="44" font-size="16" font-weight="bold" fill="#E85D3A" letter-spacing="2">ONE NUMBER, THREE LEAKS</text>

  <!-- Aggregate top -->
  <rect x="260" y="60" width="280" height="50" rx="10" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="400" y="93" font-size="20" font-weight="black" fill="#0A0A0A" text-anchor="middle">73.1% abandoned</text>

  <!-- Split arrows -->
  <line x1="400" y1="110" x2="400" y2="135" stroke="#0A0A0A" stroke-width="4"/>
  <line x1="400" y1="135" x2="140" y2="170" stroke="#0A0A0A" stroke-width="4"/>
  <line x1="400" y1="135" x2="400" y2="170" stroke="#0A0A0A" stroke-width="4"/>
  <line x1="400" y1="135" x2="660" y2="170" stroke="#0A0A0A" stroke-width="4"/>

  <!-- Leak 1 -->
  <rect x="30" y="170" width="220" height="180" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="4"/>
  <text x="50" y="198" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">CLUSTER 1</text>
  <text x="50" y="226" font-size="17" font-weight="bold" fill="#0A0A0A">Shipping surprise</text>
  <text x="50" y="254" font-size="9.5" fill="#0A0A0A">Cost appears first time at shipping step</text>
  <rect x="50" y="310" width="120" height="28" fill="#6D28D9"/>
  <text x="65" y="328" font-size="13" font-weight="bold" fill="#FFFFFF">CART FIX</text>

  <!-- Leak 2 -->
  <rect x="290" y="170" width="220" height="180" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="310" y="198" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">CLUSTER 2</text>
  <text x="310" y="226" font-size="18" font-weight="bold" fill="#0A0A0A">Promo-code rage</text>
  <text x="310" y="254" font-size="9.5" fill="#0A0A0A">Field silently fails, no feedback</text>
  <rect x="310" y="310" width="120" height="28" fill="#E85D3A"/>
  <text x="325" y="328" font-size="9.5" font-weight="bold" fill="#FFFFFF">INLINE VALIDATION</text>

  <!-- Leak 3 -->
  <rect x="550" y="170" width="220" height="180" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="4"/>
  <text x="570" y="198" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">CLUSTER 3</text>
  <text x="570" y="226" font-size="18" font-weight="bold" fill="#0A0A0A">Payment dead-end</text>
  <text x="570" y="254" font-size="9.5" fill="#0A0A0A">"Something went wrong" — no retry</text>
  <rect x="570" y="310" width="120" height="28" fill="#059669"/>
  <text x="585" y="328" font-size="11.5" font-weight="bold" fill="#FFFFFF">RECOVERY PATH</text>

  <text x="400" y="378" font-size="14" fill="#0A0A0A" text-anchor="middle" opacity="0.7">Same dashboard number. Three different users. Three different fixes.</text>
</svg>