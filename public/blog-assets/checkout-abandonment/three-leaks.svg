<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="460" fill="#F5F2EC"/>
  <rect x="8" y="8" width="944" height="444" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="52" font-size="13" font-weight="bold" fill="#E85D3A" letter-spacing="2">ONE NUMBER, THREE LEAKS — THE REAL PROBLEM</text>

  <!-- aggregate top -->
  <rect x="330" y="80" width="300" height="52" rx="10" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="480" y="113" font-size="18" font-weight="black" fill="#0A0A0A" text-anchor="middle">73.1% abandoned</text>

  <!-- arrow down split into 3 -->
  <line x1="480" y1="132" x2="480" y2="160" stroke="#0A0A0A" stroke-width="4"/>
  <line x1="480" y1="160" x2="170" y2="200" stroke="#0A0A0A" stroke-width="4"/>
  <line x1="480" y1="160" x2="480" y2="200" stroke="#0A0A0A" stroke-width="4"/>
  <line x1="480" y1="160" x2="790" y2="200" stroke="#0A0A0A" stroke-width="4"/>

  <!-- leak 1 -->
  <rect x="60" y="200" width="220" height="196" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="4"/>
  <text x="80" y="226" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">CLUSTER 1</text>
  <text x="80" y="252" font-size="16" font-weight="bold" fill="#0A0A0A">Shipping surprise</text>
  <text x="80" y="278" font-size="13" fill="#0A0A0A" opacity="0.7">Full cost appears on the shipping step for the first time.</text>
  <rect x="80" y="330" width="90" height="24" fill="#6D28D9"/>
  <text x="90" y="347" font-size="13" font-weight="bold" fill="#FFFFFF">CART FIX</text>

  <!-- leak 2 -->
  <rect x="375" y="202" width="210" height="196" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="395" y="226" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">CLUSTER 2</text>
  <text x="395" y="252" font-size="16" font-weight="bold" fill="#0A0A0A">Promo-code rage</text>
  <text x="395" y="278" font-size="13" fill="#0A0A0A" opacity="0.7">A non-functional promo field that silently fails.</text>
  <rect x="395" y="330" width="90" height="24" fill="#E85D3A"/>
  <text x="405" y="347" font-size="13" font-weight="bold" fill="#FFFFFF">INLINE VALIDATION</text>

  <!-- leak 3 -->
  <rect x="690" y="202" width="210" height="196" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="4"/>
  <text x="710" y="226" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">CLUSTER 3</text>
  <text x="710" y="252" font-size="16" font-weight="bold" fill="#0A0A0A">Payment dead-end</text>
  <text x="710" y="278" font-size="13" fill="#0A0A0A" opacity="0.7">"Something went wrong" — no retry path.</text>
  <rect x="710" y="330" width="90" height="24" fill="#059669"/>
  <text x="720" y="347" font-size="13" font-weight="bold" fill="#FFFFFF">RECOVERY PATH</text>

  <text x="60" y="432" font-size="14" fill="#0A0A0A" opacity="0.7">Same dashboard number. Three different users. Three different fixes.</text>
</svg>