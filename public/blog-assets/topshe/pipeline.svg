<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="800" height="380" fill="#F5F2EC"/>
  <rect x="8" y="8" width="784" height="364" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="44" font-size="16" font-weight="bold" fill="#E85D3A" letter-spacing="2">TOPSHE VOICE PIPELINE — EDGE ONLY, NO NETWORK HOP</text>

  <!-- Stage boxes -->
  <rect x="30" y="70" width="150" height="100" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="42" y="96" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">WAKE WORD</text>
  <text x="42" y="120" font-size="14" font-weight="bold" fill="#0A0A0A">Porcupine WASM</text>
  <text x="42" y="144" font-size="13" fill="#0A0A0A" opacity="0.75">~50 ms</text>

  <rect x="200" y="70" width="150" height="100" rx="10" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="212" y="96" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STT</text>
  <text x="212" y="120" font-size="9.5" font-weight="bold" fill="#0A0A0A">Web Speech + Whisper.cpp</text>
  <text x="212" y="144" font-size="11" fill="#0A0A0A" opacity="0.75">Streaming partials</text>

  <rect x="370" y="70" width="170" height="100" rx="10" fill="#6D28D9" stroke="#0A0A0A" stroke-width="4"/>
  <text x="382" y="96" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">LLM</text>
  <text x="382" y="120" font-size="14" font-weight="bold" fill="#FFFFFF">Qwen 2.5 1.5B Q4</text>
  <text x="382" y="144" font-size="11.5" fill="#FFFFFF" opacity="0.85">wllama WASM, ~900 MB</text>

  <rect x="560" y="70" width="150" height="100" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="572" y="96" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">TOOLS</text>
  <text x="572" y="120" font-size="10.5" font-weight="bold" fill="#0A0A0A">web_search, weather</text>
  <text x="572" y="144" font-size="9.5" fill="#0A0A0A">stocks, news, calendar</text>

  <rect x="730" y="70" width="50" height="100" rx="10" fill="#E85D3A" stroke="#0A0A0A" stroke-width="3"/>
  <text x="740" y="96" font-size="11" font-weight="bold" fill="#FFFFFF" letter-spacing="1">TTS</text>
  <text x="740" y="120" font-size="9.5" fill="#FFFFFF">Web Speech</text>
  <text x="740" y="144" font-size="9.5" fill="#FFFFFF">+ Piper WASM</text>

  <!-- Arrows -->
  <line x1="180" y1="120" x2="200" y2="120" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="200,114 210,120 200,126" fill="#0A0A0A"/>
  <line x1="350" y1="120" x2="370" y2="120" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="370,114 380,120 370,126" fill="#0A0A0A"/>
  <line x1="540" y1="120" x2="560" y2="120" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="560,114 570,120 560,126" fill="#0A0A0A"/>
  <line x1="710" y1="120" x2="730" y2="120" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="730,114 740,120 730,126" fill="#0A0A0A"/>

  <!-- Tools detail -->
  <rect x="30" y="200" width="740" height="150" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="50" y="230" font-size="15" font-weight="bold" fill="#0A0A0A">TOOL REGISTRY — EVERY CAPABILITY A HANDLER, NO NETWORK HOP</text>
  <text x="50" y="260" font-size="14" fill="#0A0A0A"><tspan font-weight="bold">Research:</tspan> web_search, weather, stocks, news</text>
  <text x="50" y="288" font-size="14" fill="#0A0A0A"><tspan font-weight="bold">Plan:</tspan> todo, reminder, timer, alarm</text>
  <text x="50" y="316" font-size="14" fill="#0A0A0A"><tspan font-weight="bold">Records:</tspan> calendar, email, RAG embed (OAuth only)</text>
  <text x="50" y="344" font-size="14" fill="#0A0A0A" opacity="0.7"><tspan font-weight="bold">No network hop:</tspan> only explicit OAuth to your Google/Outlook calendars leaves the device</text>
</svg>