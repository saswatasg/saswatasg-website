<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="460" fill="#F5F2EC"/>
  <rect x="8" y="8" width="944" height="444" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="52" font-size="13" font-weight="bold" fill="#E85D3A" letter-spacing="2">FILMRISK.AI — 10 FEATURES, GBM + PRIORS, HONEST BACKTEST</text>

  <!-- Feature columns -->
  <text x="60" y="112" font-size="12" font-weight="bold" fill="#0A0A0A" letter-spacing="1">FEATURE GROUPS</text>
  <text x="60" y="136" font-size="12" fill="#0A0A0A">Genre</text>
  <text x="60" y="158" font-size="12" fill="#0A0A0A">Cast</text>
  <text x="60" y="180" font-size="12" fill="#0A0A0A">Director</text>
  <text x="60" y="202" font-size="12" fill="#0A0A0A">Release window</text>
  <text x="60" y="224" font-size="12" fill="#0A0A0A">Budgets</text>
  <text x="60" y="246" font-size="12" fill="#0A0A0A">Star momentum</text>
  <text x="60" y="268" font-size="12" fill="#0A0A0A">Sequel flag</text>
  <text x="60" y="290" font-size="12" fill="#0A0A0A">Production house</text>
  <text x="60" y="312" font-size="12" fill="#0A0A0A">Language</text>
  <text x="60" y="334" font-size="12" fill="#0A0A0A">Seasonality</text>

  <!-- GBM block -->
  <rect x="280" y="90" width="200" height="280" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="300" y="118" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">GBM</text>
  <text x="300" y="148" font-size="13" font-weight="bold" fill="#0A0A0A">Gradient Boosting</text>
  <text x="300" y="180" font-size="12" fill="#0A0A0A" opacity="0.75">Learns 10-way</text>
  <text x="300" y="202" font-size="12" fill="#0A0A0A" opacity="0.75">interactions</text>
  <text x="300" y="234" font-size="12" fill="#0A0A0A" opacity="0.75">Loves stars</text>
  <text x="300" y="256" font-size="12" fill="#0A0A0A" opacity="0.75">Overfits thin data</text>
  <text x="300" y="288" font-size="12" fill="#0A0A0A" opacity="0.75">Raw score</text>
  <text x="300" y="320" font-size="12" fill="#0A0A0A" opacity="0.75">→ prior needed</text>

  <!-- Priors block -->
  <rect x="500" y="90" width="200" height="280" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="520" y="118" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">PRIORS</text>
  <text x="520" y="148" font-size="13" font-weight="bold" fill="#0A0A0A">Bayesian Base Rates</text>
  <text x="520" y="180" font-size="12" fill="#0A0A0A" opacity="0.75">Category: genre × budget × lang</text>
  <text x="520" y="202" font-size="12" fill="#0A0A0A" opacity="0.75">Pulls thin data</text>
  <text x="520" y="224" font-size="12" fill="#0A0A0A" opacity="0.75">toward average</text>
  <text x="520" y="256" font-size="12" fill="#0A0A0A" opacity="0.75">posterior ∝</text>
  <text x="520" y="278" font-size="12" fill="#0A0A0A" opacity="0.75">likelihood × prior</text>
  <text x="520" y="320" font-size="12" fill="#0A0A0A" opacity="0.75">Calibrated score</text>

  <!-- Backtest block -->
  <rect x="720" y="90" width="200" height="280" rx="12" fill="#E85D3A" stroke="#0A0A0A" stroke-width="4"/>
  <text x="740" y="118" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="1">BACKTEST</text>
  <text x="740" y="148" font-size="13" font-weight="bold" fill="#FFFFFF">Every Commit</text>
  <text x="740" y="180" font-size="12" fill="#FFFFFF" opacity="0.9">2,200+ films</text>
  <text x="740" y="202" font-size="12" fill="#FFFFFF" opacity="0.9">Full re-run</text>
  <text x="740" y="234" font-size="12" fill="#F59E0B">Published</text>
  <text x="740" y="256" font-size="12" fill="#FFFFFF" opacity="0.9">Failure modes</text>
  <text x="740" y="278" font-size="12" fill="#FFFFFF" opacity="0.9">Confidence intervals</text>
  <text x="740" y="320" font-size="12" fill="#F59E0B">Repo: /saswatasg/FilmRisk.AI</text>

  <!-- Arrow flow -->
  <line x1="480" y1="230" x2="500" y2="230" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="500,224 510,230 500,236" fill="#0A0A0A"/>
  <line x1="700" y1="230" x2="720" y2="230" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="720,224 730,230 720,236" fill="#0A0A0A"/>

  <!-- Bottom note -->
  <rect x="40" y="390" width="880" height="54" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="60" y="414" font-size="14" font-weight="bold" fill="#0A0A0A">The engine that admits when it doesn't know.</text>
  <text x="60" y="436" font-size="12" fill="#0A0A0A" opacity="0.75">Star-heavy bundles score under the prior. Sequel + date > cast creativity. Selection engine, not oracle.</text>
</svg>