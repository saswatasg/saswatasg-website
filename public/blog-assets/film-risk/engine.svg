<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="800" height="400" fill="#F5F2EC"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="44" font-size="16" font-weight="bold" fill="#E85D3A" letter-spacing="2">FILMRISK.AI — 10 FEATURES, GBM + PRIORS, HONEST BACKTEST</text>

  <!-- Feature list -->
  <text x="40" y="90" font-size="14" font-weight="bold" fill="#0A0A0A" letter-spacing="1">FEATURES</text>
  <text x="40" y="116" font-size="15" fill="#0A0A0A">Genre, Cast, Director, Release window</text>
  <text x="40" y="142" font-size="15" fill="#0A0A0A">Budgets, Star momentum, Sequel flag</text>
  <text x="40" y="168" font-size="15" fill="#0A0A0A">Production house, Language, Seasonality</text>

  <!-- GBM -->
  <rect x="30" y="190" width="230" height="180" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="45" y="218" font-size="15" font-weight="bold" fill="#0A0A0A" letter-spacing="1">GBM</text>
  <text x="45" y="246" font-size="14" font-weight="bold" fill="#0A0A0A">Gradient Boosting</text>
  <text x="45" y="274" font-size="10" fill="#0A0A0A" opacity="0.75">Learns 10-way interactions</text>
  <text x="45" y="302" font-size="10" fill="#0A0A0A" opacity="0.75">Loves stars, overfits thin data</text>
  <text x="45" y="330" font-size="10" fill="#0A0A0A" opacity="0.75">Raw score → prior needed</text>

  <!-- Priors -->
  <rect x="280" y="190" width="230" height="180" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="295" y="218" font-size="15" font-weight="bold" fill="#0A0A0A" letter-spacing="1">PRIORS</text>
  <text x="295" y="246" font-size="14" font-weight="bold" fill="#0A0A0A">Bayesian Base Rates</text>
  <text x="295" y="274" font-size="10" fill="#0A0A0A" opacity="0.75">Category: genre × budget × lang</text>
  <text x="295" y="302" font-size="10" fill="#0A0A0A" opacity="0.75">Pulls thin data toward average</text>
  <text x="295" y="330" font-size="10" fill="#0A0A0A" opacity="0.75">posterior ∝ likelihood × prior</text>

  <!-- Backtest -->
  <rect x="530" y="190" width="230" height="180" rx="12" fill="#E85D3A" stroke="#0A0A0A" stroke-width="4"/>
  <text x="545" y="218" font-size="15" font-weight="bold" fill="#FFFFFF" letter-spacing="1">BACKTEST</text>
  <text x="545" y="246" font-size="14" font-weight="bold" fill="#FFFFFF">Every Commit</text>
  <text x="545" y="274" font-size="12.5" fill="#FFFFFF" opacity="0.9">2,200+ films, full re-run</text>
  <text x="545" y="302" font-size="13.5" fill="#F59E0B" font-weight="bold">Published failure modes</text>
  <text x="545" y="330" font-size="12.5" fill="#FFFFFF" opacity="0.9">Confidence intervals</text>

  <!-- Flow arrows -->
  <line x1="260" y1="280" x2="280" y2="280" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="280,274 290,280 280,286" fill="#0A0A0A"/>
  <line x1="510" y1="280" x2="530" y2="280" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="530,274 540,280 530,286" fill="#0A0A0A"/>

  <rect x="40" y="350" width="720" height="40" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="400" y="375" font-size="12.5" font-weight="bold" fill="#0A0A0A" text-anchor="middle">The engine that admits when it doesn't know — star-heavy bundles score under the prior</text>
</svg>