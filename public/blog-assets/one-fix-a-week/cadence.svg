<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="800" height="400" fill="#F5F2EC"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="44" font-size="16" font-weight="bold" fill="#E85D3A" letter-spacing="2">ONE FIX A WEEK — THE CADENCE</text>

  <!-- Step 1 -->
  <rect x="40" y="70" width="160" height="120" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="55" y="98" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">1. PICK</text>
  <text x="55" y="126" font-size="13" fill="#0A0A0A">One funnel step:</text>
  <text x="55" y="148" font-size="13" fill="#0A0A0A">checkout, form,</text>
  <text x="55" y="170" font-size="13" fill="#0A0A0A">search, PDP</text>

  <path d="M 200 130 L 226 130" stroke="#0A0A0A" stroke-width="3" marker-end="none"/>
  <path d="M 218 122 L 230 130 L 218 138" fill="none" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Step 2 -->
  <rect x="230" y="70" width="160" height="120" rx="10" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="245" y="98" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">2. HYPOTHESISE</text>
  <text x="245" y="126" font-size="13" fill="#0A0A0A">One sentence,</text>
  <text x="245" y="148" font-size="13" fill="#0A0A0A">from events +</text>
  <text x="245" y="170" font-size="13" fill="#0A0A0A">session replays</text>

  <path d="M 390 130 L 416 130" stroke="#0A0A0A" stroke-width="3"/>
  <path d="M 408 122 L 420 130 L 408 138" fill="none" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Step 3 -->
  <rect x="420" y="70" width="160" height="120" rx="10" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="435" y="98" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">3. SHIP CHEAPEST</text>
  <text x="435" y="126" font-size="12" fill="#0A0A0A">The smallest</text>
  <text x="435" y="148" font-size="12" fill="#0A0A0A">change that tests</text>
  <text x="435" y="170" font-size="12" fill="#0A0A0A">the hypothesis</text>

  <path d="M 580 130 L 606 130" stroke="#0A0A0A" stroke-width="3"/>
  <path d="M 598 122 L 610 130 L 598 138" fill="none" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Step 4 -->
  <rect x="610" y="70" width="150" height="120" rx="10" fill="#E85D3A" stroke="#0A0A0A" stroke-width="4"/>
  <text x="625" y="98" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="1">4. WATCH 1 KPI</text>
  <text x="625" y="126" font-size="13" fill="#FFFFFF">Two weeks.</text>
  <text x="625" y="148" font-size="13" fill="#FFFFFF">Keep, kill,</text>
  <text x="625" y="170" font-size="13" fill="#FFFFFF">or learn.</text>

  <!-- Loop back -->
  <path d="M 685 190 L 685 230 L 120 230 L 120 194" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-dasharray="8,8"/>
  <path d="M 112 202 L 120 190 L 128 202" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <text x="400" y="222" font-size="12" font-weight="bold" fill="#0A0A0A" text-anchor="middle" letter-spacing="1">NEXT TUESDAY: REPEAT</text>

  <!-- Compounding strip -->
  <rect x="40" y="250" width="720" height="60" rx="10" fill="#F59E0B" stroke="#0A0A0A" stroke-width="4"/>
  <text x="400" y="276" font-size="14" font-weight="bold" fill="#0A0A0A" text-anchor="middle">COMPOUNDING TRAIL: checkout −26% · search revenue +14% · qualified leads +34%</text>
  <text x="400" y="298" font-size="13" fill="#0A0A0A" text-anchor="middle">One boring, measured fix at a time — attribution stays clean</text>

  <rect x="40" y="330" width="720" height="44" rx="10" fill="#0A0A0A"/>
  <text x="400" y="357" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A fix that isn't watched is a guess with a build ticket attached</text>
</svg>
