  <text x="245" y="144" font-size="13" fill="#0A0A0A" opacity="0.7">Streaming partials</text>

  <rect x="420" y="70" width="180" height="100" rx="10" fill="#6D28D9" stroke="#0A0A0A" stroke-width="4"/>
