<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="440" fill="#F5F2EC"/>
  <rect x="8" y="8" width="944" height="424" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <text x="40" y="52" font-size="13" font-weight="bold" fill="#E85D3A" letter-spacing="2">AI RECRUITER AGENT — FOUR STAGES, ONE GATE</text>

  <!-- Stage 1: Discovery -->
  <rect x="40" y="86" width="210" height="150" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="60" y="114" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STAGE 1</text>
  <text x="60" y="138" font-size="15" font-weight="bold" fill="#0A0A0A">Target Discovery</text>
  <text x="60" y="162" font-size="12" fill="#0A0A0A" opacity="0.75">Role + geo + signals</text>
  <text x="60" y="186" font-size="12" fill="#0A0A0A" opacity="0.75">→ LinkedIn search</text>
  <text x="60" y="210" font-size="12" fill="#0A0A0A" opacity="0.75">→ recruiter profiles</text>

  <!-- Stage 2: Research -->
  <rect x="270" y="86" width="210" height="150" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="3"/>
  <text x="290" y="114" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STAGE 2</text>
  <text x="290" y="138" font-size="15" font-weight="bold" fill="#0A0A0A">Research & Enrichment</text>
  <text x="290" y="162" font-size="12" fill="#0A0A0A" opacity="0.75">Posts, funding, news</text>
  <text x="290" y="186" font-size="12" fill="#0A0A0A" opacity="0.75">Shared connections</text>
  <text x="290" y="210" font-size="12" fill="#0A0A0A" opacity="0.75">Company context</text>

  <!-- Stage 3: Draft -->
  <rect x="500" y="86" width="210" height="150" rx="12" fill="#EEF2FF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="520" y="114" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STAGE 3</text>
  <text x="520" y="138" font-size="15" font-weight="bold" fill="#0A0A0A">Draft Intro</text>
  <text x="520" y="162" font-size="12" fill="#0A0A0A" opacity="0.75">Your tone, their context</text>
  <text x="520" y="186" font-size="12" fill="#0A0A0A" opacity="0.75">No boilerplate</text>
  <text x="520" y="210" font-size="12" fill="#0A0A0A" opacity="0.75">Draft only — not sent</text>

  <!-- Stage 4: Human Gate (highlighted) -->
  <rect x="730" y="86" width="190" height="150" rx="12" fill="#F59E0B" stroke="#0A0A0A" stroke-width="4"/>
  <text x="745" y="114" font-size="13" font-weight="bold" fill="#0A0A0A" letter-spacing="1">STAGE 4</text>
  <text x="745" y="138" font-size="15" font-weight="bold" fill="#0A0A0A">Human Gate</text>
  <text x="745" y="162" font-size="12" fill="#0A0A0A" opacity="0.9">YOU approve</text>
  <text x="745" y="186" font-size="12" fill="#0A0A0A" opacity="0.9">Then send</text>
  <text x="745" y="210" font-size="12" fill="#0A0A0A" opacity="0.9">Fail-closed</text>

  <!-- Arrows -->
  <line x1="250" y1="160" x2="270" y2="160" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="270,154 280,160 270,166" fill="#0A0A0A"/>
  <line x1="480" y1="160" x2="500" y2="160" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="500,154 510,160 500,166" fill="#0A0A0A"/>
  <line x1="710" y1="160" x2="730" y2="160" stroke="#0A0A0A" stroke-width="3"/>
  <polygon points="730,154 740,160 730,166" fill="#0A0A0A"/>

  <!-- Key stats -->
  <rect x="40" y="270" width="880" height="140" rx="12" fill="#FFF4ED" stroke="#0A0A0A" stroke-width="4"/>
  <text x="60" y="298" font-size="14" font-weight="bold" fill="#0A0A0A">The numbers that matter</text>
  <text x="60" y="328" font-size="14" fill="#0A0A0A"><tspan font-weight="bold">766 commits</tspan> · <tspan font-weight="bold">6 releases</tspan> · <tspan font-weight="bold">self-hosted macOS app</tspan> · <tspan font-weight="bold">Python/Django/Playwright</tspan></text>
  <text x="60" y="358" font-size="14" fill="#0A0A0A"><tspan font-weight="bold">Metric:</tspan> reply rate on qualified personas — not messages sent.</text>
  <text x="60" y="388" font-size="14" fill="#0A0A0A" opacity="0.75">Repo: github.com/saswatasg/TGBhunt · v1.0.9</text>
</svg>