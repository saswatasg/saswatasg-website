name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build + prerender + verify
        run: npm run build

      - name: IndexNow submission (Bing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.INDEXNOW_KEY != ''
        run: node tools/ping-indexnow.mjs
